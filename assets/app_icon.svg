<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F378B" />
            <stop offset="100%" stop-color="#21005D" />
        </linearGradient>
        <linearGradient id="marker" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#EADDFF" />
            <stop offset="100%" stop-color="#D0BCFF" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- App Icon Background (Squircle) -->
    <rect width="512" height="512" rx="128" fill="url(#bg)" />

    <!-- Map Marker Outline/Background -->
    <path d="M256,64 C167.6,64 96,135.6 96,224 C96,339.6 244.3,463.3 249.2,467.4 C253,470.5 259,470.5 262.8,467.4 C267.7,463.3 416,339.6 416,224 C416,135.6 344.4,64 256,64 Z" 
          fill="url(#marker)" 
          filter="url(#shadow)" />

    <!-- Inner Circle representing Activity/Life -->
    <circle cx="256" cy="224" r="70" fill="#21005D" />
    
    <!-- Heart shape inside the circle -->
    <path d="M 256 275 C 256 275 206 230 206 200 C 206 180 220 165 240 165 C 250 165 256 175 256 175 C 256 175 262 165 272 165 C 292 165 306 180 306 200 C 306 230 256 275 256 275 Z" 
          fill="#EADDFF" />
</svg>
